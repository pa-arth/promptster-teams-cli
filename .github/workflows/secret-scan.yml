name: secret-scan

# A product whose entire pitch is on-device secret redaction should scan its
# OWN source for committed credentials. gitleaks runs on every push/PR and on
# a weekly schedule over full history.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "42 5 * * 1"

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan full history, not just the tip
      # Run the gitleaks binary directly rather than gitleaks-action: the
      # action requires a GITLEAKS_LICENSE key for org-owned repos,
      # the CLI (MIT) does not. Pinned by version + sha256, like the actions.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "/tmp/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  /tmp/${tarball}" | sha256sum -c -
          tar -xzf "/tmp/${tarball}" -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan full history
        # .gitleaksignore at the repo root is picked up automatically.
        run: gitleaks git --redact --verbose --exit-code 1 .
